<!DOCTYPE html>
<html>
<body>
<h1>Proxy</h1>
<script>
let target = { message: "Hello" };
let handler = {
  get(obj, prop) {
    return prop in obj ? obj[prop] : "Not Found";
  }
};

let proxy = new Proxy(target, handler);
console.log(proxy.message);
console.log(proxy.unknown);
</script>
</body>
</html>
